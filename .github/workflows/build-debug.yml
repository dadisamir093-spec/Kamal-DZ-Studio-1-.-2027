name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore or generate debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            ls -l debug.keystore
            keytool -list -keystore debug.keystore -storepass "${DEBUG_STORE_PASSWORD:-android}" 2>&1 | head -5
            echo "Debug keystore restored from secrets (stable signature)."
          else
            echo "DEBUG_KEYSTORE_BASE64 not set - generating a temporary debug keystore."
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        env:
          DEBUG_APPCHECK_TOKEN: ${{ secrets.DEBUG_APPCHECK_TOKEN }}
        run: gradle assembleDebug --stacktrace
